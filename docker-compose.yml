services:
  postgres:
    # Opt-in: a deployment pointing DATABASE_URL at a managed Postgres (Supabase,
    # RDS, Neon) must not have this container start and race for the host port.
    # Bring the bundled database up with `--profile local-db`.
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - apps/server/.env
    environment:
      POSTGRES_DB: lore_memory
      POSTGRES_USER: lore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lore"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    profiles: ["local-embedding"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/server/.env
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-3100}:${MCP_SERVER_PORT:-3100}"
    depends_on:
      postgres:
        condition: service_healthy
        # required: false keeps the health gate when the local-db profile is
        # active, and lets the project stay valid when it is not. Without it
        # compose refuses to parse: "depends on undefined service postgres".
        required: false

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time interpolation: provide via shell env, e.g.
        #   NEXT_PUBLIC_LORE_API_URL=https://lore.example.com docker compose build web
        # Defaults to localhost so `docker compose build web` works out of the box.
        NEXT_PUBLIC_LORE_API_URL: ${NEXT_PUBLIC_LORE_API_URL:-http://localhost:3100}
    restart: unless-stopped
    env_file:
      - apps/web/.env
    ports:
      # Host port is env-driven so a box already using 3001 configures it in
      # .env instead of carrying a local edit to this file forever.
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    depends_on:
      mcp-server:
        condition: service_started

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
